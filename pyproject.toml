[project]
name = "jlpt-bot"
version = "0.1.0"
description = "Discord bot for JLPT quiz practice (N5-N1, fastest-finger scoring)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "discord.py==2.7.1",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "aiosqlite>=0.19.0",
  "weasyprint>=62.0",
  "pymupdf>=1.24.0",
]

[project.scripts]
jlpt-bot = "jlpt_bot.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlpt_bot"]

[tool.ruff]
target-version = "py314"
line-length = 100
